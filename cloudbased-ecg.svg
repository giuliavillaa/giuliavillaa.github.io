<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="CloudbasedECG flow: the patient records a voice note on the Apple Watch, an LLM prompt turns it into time, activity and symptoms, and the patient checks and saves it. The note is pinned to the moment on the ECG timeline, a background AI check flags findings, and the cardiologist decides.">
  <style>
    .box  { fill:#FFFFFF; stroke:#DBD9D3; stroke-width:1.5 }
    .hl   { fill:#E5E2F4; stroke:#3A2E8F; stroke-width:2.5 }
    .t    { font-family:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif; font-size:22px; font-weight:600; fill:#1A1C20 }
    .ta   { fill:#3A2E8F }
    .s    { font-family:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif; font-size:17px; fill:#5C6169 }
    .k    { font-family:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif; font-size:16px; font-weight:500; fill:#8A8F97; letter-spacing:1px }
    .ln   { stroke:#3A2E8F; stroke-width:2.5; fill:none }
    .dash { stroke:#8A8F97; stroke-width:2; fill:none; stroke-dasharray:6 6 }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A2E8F"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A8F97"/></marker>
  </defs>

  <rect width="800" height="500" fill="#EDECE7"/>

  <!-- Patient, Apple Watch -->
  <text class="k" x="30" y="52">PATIENT · APPLE WATCH</text>

  <rect class="box" x="30" y="70" width="205" height="95" rx="4"/>
  <text class="t" x="50" y="110">Voice note</text>
  <text class="s" x="50" y="141">“stinging in my chest”</text>

  <rect class="hl" x="290" y="70" width="210" height="95" rx="4"/>
  <text class="t ta" x="310" y="110">LLM prompt</text>
  <text class="s" x="310" y="141">symptoms, activity</text>

  <rect class="hl" x="555" y="70" width="215" height="95" rx="4"/>
  <text class="t ta" x="575" y="110">Check &amp; Save</text>
  <text class="s" x="575" y="141">the patient confirms</text>

  <path class="ln" d="M235,117 L284,117" marker-end="url(#a)"/>
  <path class="ln" d="M500,117 L549,117" marker-end="url(#a)"/>

  <!-- Cardiologist, web -->
  <text class="k" x="30" y="282">CARDIOLOGIST · WEB</text>

  <rect class="box" x="555" y="300" width="215" height="95" rx="4"/>
  <text class="t" x="575" y="340">ECG timeline</text>
  <text class="s" x="575" y="371">pinned to the beat</text>

  <rect class="box" x="290" y="300" width="210" height="95" rx="4"/>
  <text class="t" x="310" y="340">AI check</text>
  <text class="s" x="310" y="371">in the background</text>

  <rect class="hl" x="30" y="300" width="205" height="95" rx="4"/>
  <text class="t ta" x="50" y="340">Doctor decides</text>
  <text class="s" x="50" y="371">finding + confidence</text>

  <path class="ln" d="M662,165 L662,294" marker-end="url(#a)"/>
  <path class="dash" d="M555,347 L506,347" marker-end="url(#g)"/>
  <path class="dash" d="M290,347 L241,347" marker-end="url(#g)"/>

  <text class="k" x="30" y="452">THE PATIENT CHECKS WHAT THE AI HEARD · THE AI FLAGS, THE DOCTOR DECIDES</text>
</svg>
