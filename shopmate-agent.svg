<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3A2E8F"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8F97"/>
    </marker>
  </defs>
  <style>
    .t{font-family:"IBM Plex Sans",Helvetica,Arial,sans-serif;fill:#1A1C20}
    .m{font-family:"IBM Plex Mono",Menlo,Consolas,monospace;fill:#5C6169}
    .box{fill:#FFFFFF;stroke:#DBD9D3;stroke-width:1.5}
    .hl{fill:#E5E2F4;stroke:#3A2E8F;stroke-width:1.5}
    .ln{stroke:#3A2E8F;stroke-width:1.6;fill:none}
    .lg{stroke:#8A8F97;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
  </style>

  <rect width="800" height="500" fill="#EDECE7"/>

  <!-- inputs -->
  <rect class="box" x="30" y="70" width="190" height="96" rx="3"/>
  <text class="t" x="46" y="98" font-size="15" font-weight="600">Ledger</text>
  <text class="m" x="46" y="120" font-size="11.5">stock · weekly sales</text>
  <text class="m" x="46" y="138" font-size="11.5">suppliers · season</text>
  <text class="m" x="46" y="156" font-size="11.5">open-to-buy budget</text>

  <rect class="box" x="30" y="196" width="190" height="78" rx="3"/>
  <text class="t" x="46" y="224" font-size="15" font-weight="600">Shop floor</text>
  <text class="m" x="46" y="246" font-size="11.5">"3 customers asked</text>
  <text class="m" x="46" y="263" font-size="11.5"> for white sneakers 40"</text>

  <rect class="box" x="30" y="304" width="190" height="78" rx="3"/>
  <text class="t" x="46" y="332" font-size="15" font-weight="600">Schedules</text>
  <text class="m" x="46" y="354" font-size="11.5">daily alert · Monday buy</text>
  <text class="m" x="46" y="371" font-size="11.5">monthly plan · Fri review</text>

  <!-- agent -->
  <rect class="hl" x="290" y="150" width="200" height="150" rx="3"/>
  <text class="t" x="390" y="186" font-size="18" font-weight="600" text-anchor="middle">ShopMate</text>
  <text class="m" x="390" y="208" font-size="11.5" text-anchor="middle">Slack teammate</text>
  <text class="m" x="390" y="236" font-size="11.5" text-anchor="middle">weeks of cover by size</text>
  <text class="m" x="390" y="254" font-size="11.5" text-anchor="middle">season rule · budget cut</text>
  <text class="m" x="390" y="272" font-size="11.5" text-anchor="middle">trends ±20%, with a link</text>

  <path class="ln" d="M220 118 C255 118 255 190 288 195" marker-end="url(#a)"/>
  <path class="ln" d="M220 235 L288 235" marker-end="url(#a)"/>
  <path class="ln" d="M220 343 C255 343 255 280 288 275" marker-end="url(#a)"/>

  <!-- proposal -->
  <rect class="box" x="560" y="70" width="210" height="112" rx="3"/>
  <text class="t" x="576" y="98" font-size="15" font-weight="600">Proposal, by size</text>
  <text class="m" x="576" y="122" font-size="11.5">Sneaker Alba · white</text>
  <text class="m" x="576" y="140" font-size="11.5">38×20  39×32  40×20</text>
  <text class="m" x="576" y="164" font-size="11.5">€5,302 of €5,440 budget</text>
  <path class="ln" d="M490 200 C525 200 525 126 558 126" marker-end="url(#a)"/>

  <!-- gate -->
  <rect class="hl" x="560" y="214" width="210" height="72" rx="3"/>
  <text class="t" x="665" y="244" font-size="15" font-weight="600" text-anchor="middle">Owner approves</text>
  <text class="m" x="665" y="266" font-size="11.5" text-anchor="middle">Approve / Deny in thread</text>
  <path class="ln" d="M665 182 L665 212" marker-end="url(#a)"/>

  <!-- output -->
  <rect class="box" x="560" y="318" width="210" height="64" rx="3"/>
  <text class="t" x="665" y="346" font-size="15" font-weight="600" text-anchor="middle">Purchase order</text>
  <text class="m" x="665" y="367" font-size="11.5" text-anchor="middle">written only after a yes</text>
  <path class="ln" d="M665 286 L665 316" marker-end="url(#a)"/>

  <!-- learning loop -->
  <path class="lg" d="M560 262 C470 262 470 420 390 420 C330 420 330 330 380 302" marker-end="url(#g)"/>
  <text class="m" x="412" y="446" font-size="11.5" text-anchor="middle">owner edits → proposed skill update → approved</text>

  <text class="m" x="30" y="40" font-size="12" fill="#8A8F97">signals in · proposal out · nothing is written without a yes</text>
</svg>
